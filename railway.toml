[build]
# Railway auto-detects the Dockerfile. Setting builder explicitly ensures
# it always uses Docker rather than Nixpacks.
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# PORT is injected by Railway at runtime — gunicorn.conf.py reads it.
# startCommand overrides any auto-detected command from other config files
# (e.g. render.yaml) and ensures the Dockerfile CMD is not shadowed.
startCommand = "gunicorn --config gunicorn.conf.py api.index:app"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
